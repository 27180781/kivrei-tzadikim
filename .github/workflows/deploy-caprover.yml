name: Deploy to CapRover

# בונה את ה-Docker image כאן בגיטהאב (הלוגים גלויים ואין עומס על השרת),
# דוחף ל-GitHub Container Registry, ומבקש מ-CapRover להריץ את ה-image החדש.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: caprover-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/27180781/kivrei-tzadikim

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_APP: ${{ secrets.CAPROVER_APP }}
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
        run: |
          if [ -z "$CAPROVER_SERVER" ] || [ -z "$CAPROVER_APP" ] || [ -z "$CAPROVER_APP_TOKEN" ]; then
            echo "::error::חסרים סודות: CAPROVER_SERVER, CAPROVER_APP, CAPROVER_APP_TOKEN (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy image to CapRover
        run: |
          npx --yes caprover@2.4.4 deploy \
            --caproverUrl "${{ secrets.CAPROVER_SERVER }}" \
            --appToken "${{ secrets.CAPROVER_APP_TOKEN }}" \
            --appName "${{ secrets.CAPROVER_APP }}" \
            --imageName "${{ env.IMAGE }}:${{ github.sha }}"
